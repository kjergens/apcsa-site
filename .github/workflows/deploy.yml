name: Deploy MkDocs to GitHub Pages
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2 # Fixed Node warning

      - name: Set up Python
        uses: actions/setup-python@v5.4.0 # Fixed Node warning
        with:
          python-version: 3.x

      - name: Install MkDocs and Material Theme
        run: |
          pip install mkdocs
          pip install mkdocs-material

      - name: Build and Deploy
        run: mkdocs gh-deploy --force
